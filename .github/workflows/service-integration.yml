name: Installed service integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: [self-hosted, windows, x64, research-vault]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Run against isolated installed service
        shell: pwsh
        env:
          RESEARCH_VAULT_FULL_INTEGRATION: 'true'
        run: |
          if (-not $env:RESEARCH_VAULT_INSTALLATION) {
            throw 'Self-hosted runner must provide a complete RESEARCH_VAULT_INSTALLATION directory.'
          }
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. test/local_service_probe.jl $env:RESEARCH_VAULT_INSTALLATION
